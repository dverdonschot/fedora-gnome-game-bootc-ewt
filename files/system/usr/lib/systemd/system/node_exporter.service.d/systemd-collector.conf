# node_exporter: enable the systemd collector. The Fedora unit starts
# the exporter with defaults, and systemd is not a default collector.
# The Container Health dashboard's unit-state panels
# (node_systemd_unit_state) need it; the NixOS hosts enable the same
# collector explicitly.
[Service]
ExecStart=
ExecStart=/usr/bin/node_exporter --collector.systemd
