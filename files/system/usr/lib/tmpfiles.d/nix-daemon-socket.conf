# nix-daemon.service gates itself on ConditionPathIsReadWrite=/nix/var/nix/
# daemon-socket, but nothing else creates that directory: on a fresh install
# the condition is unmet at boot and the daemon silently skips. Create it.
# Runs after local-fs.target, so /nix (nix.mount) is already up.
d /nix/var/nix/daemon-socket 0755 root root -
