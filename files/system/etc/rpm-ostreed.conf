# rpm-ostree daemon config shipped in the image (see rpm-ostreed.conf(5)).
# stage: download and unpack updates in the background, deploy at the next
# boot - fits a machine that is only on for a few hours a day. Not `apply`,
# which would initiate the reboot itself.
[Daemon]
AutomaticUpdatePolicy=stage
#IdleExitTimeout=60
#LockLayering=false